spring.application.name=JOBPORTAL_BACKEND

# ============================================================
# PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/jobportal
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate Configuration
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Batch fetch size: when a lazy collection is accessed, Hibernate loads it
# for up to N parent IDs in a single IN-clause query instead of 1-per-parent.
# This is the global fallback; @BatchSize(25) on each collection takes precedence.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

