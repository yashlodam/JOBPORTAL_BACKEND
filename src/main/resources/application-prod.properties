# ==============================================================================
# Production Profile Properties
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production Cookies (Cross-origin support between Vercel/Netlify frontend and Render backend)
auth.cookie-secure=${COOKIE_SECURE:true}
auth.cookie-same-site=${COOKIE_SAME_SITE:None}
auth.cookie-domain=${COOKIE_DOMAIN:}

# Production CORS (Supports Vercel deployments and local development)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5174,https://*.vercel.app,https://job-portal-frontend-rho-nine.vercel.app}

# Production Logging
logging.level.root=WARN
logging.level.com.jobportal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR

# Production Error Masking
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
