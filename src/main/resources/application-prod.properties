# ==============================================================================
# Production Profile Properties
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production Cookies (Cross-origin support between Vercel/Netlify frontend and Render backend)
auth.cookie-secure=${COOKIE_SECURE:true}
auth.cookie-same-site=${COOKIE_SAME_SITE:None}
auth.cookie-domain=${COOKIE_DOMAIN:}

# Production Logging
logging.level.root=WARN
logging.level.com.jobportal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR

# Production Error Masking
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
